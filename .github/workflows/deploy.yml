name: Deploy backend to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys race: the service holds in-memory room state, so an
# interrupted rollout is worse than a delayed one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::866730904414:role/arcade-ftw-github-deploy
  ECR_REPOSITORY: arcade-ftw-backend
  ECS_CLUSTER: arcade-ftw-cluster
  ECS_SERVICE: arcade-ftw-service
  TASK_FAMILY: arcade-ftw-task
  CONTAINER_NAME: arcade-ftw-backend
  LOG_GROUP: /ecs/arcade-ftw-backend
  # The ALB only accepts traffic from CloudFront, so health is verified through
  # the public hostname instead. Update alongside the arcade-ftw-frontend stack.
  SITE_DOMAIN: d39s9y5ma27s5.cloudfront.net

# No long-lived AWS keys: the job exchanges a short-lived GitHub OIDC token for
# temporary credentials. id-token: write is what makes that exchange possible.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The role is locked to this repository and branch, so a fork or a pull
      # request cannot assume it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ECS service exists
        id: verify
        run: |
          if aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
               --query "services[0].status" --output text 2>/dev/null | grep -q ACTIVE; then
            echo "ECS service $ECS_SERVICE is ACTIVE."
            echo "service-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "service-exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ECS service $ECS_SERVICE not found or not ACTIVE. Deploy infra/cloudformation.yml first; skipping this run."
          fi

      - name: Login to Amazon ECR
        if: steps.verify.outputs.service-exists == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        if: steps.verify.outputs.service-exists == 'true'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Read the live task definition instead of a checked-in copy, so the
      # registered revision never drifts from what ECS is actually running.
      - name: Fetch current task definition
        if: steps.verify.outputs.service-exists == 'true'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      # register-task-definition rejects these read-only fields.
      - name: Strip read-only fields
        if: steps.verify.outputs.service-exists == 'true'
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt,
                  .enableFaultInjection)' \
            task-definition.json > task-definition.clean.json

      - name: Render new image into task definition
        if: steps.verify.outputs.service-exists == 'true'
        run: |
          jq --arg image "${{ steps.build-image.outputs.image }}" \
             --arg name "$CONTAINER_NAME" \
             '(.containerDefinitions[] | select(.name == $name).image) = $image' \
             task-definition.clean.json > task-definition.rendered.json
          # Fail loudly if the substitution silently did nothing.
          jq -e --arg image "${{ steps.build-image.outputs.image }}" \
             '.containerDefinitions[] | select(.image == $image)' \
             task-definition.rendered.json > /dev/null

      # Migrations run on the new image before the rollout, so a bad migration
      # stops the deploy while the old revision keeps serving.
      - name: Register task definition
        if: steps.verify.outputs.service-exists == 'true'
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.rendered.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-def-arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $ARN"

      - name: Run database migrations
        if: steps.verify.outputs.service-exists == 'true'
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task-def-arn }}
        run: |
          # Reuse the live service's networking so the task lands in the same
          # subnets and security groups as the service itself.
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
                  --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(jq -r '.subnets | join(",")' <<< "$NET")
          SGS=$(jq -r '.securityGroups | join(",")' <<< "$NET")
          ASSIGN=$(jq -r '.assignPublicIp' <<< "$NET")

          TASK=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=$ASSIGN}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task exited with code $EXIT_CODE - not rolling out."
            aws logs tail "$LOG_GROUP" --since 15m || true
            exit 1
          fi
          echo "Migrations applied."

      - name: Roll out new task definition
        if: steps.verify.outputs.service-exists == 'true'
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task-def-arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_DEF_ARN"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify health endpoint
        if: steps.verify.outputs.service-exists == 'true'
        run: |
          # Goes through CloudFront because the load balancer now only accepts
          # traffic from CloudFront's origin-facing addresses.
          echo "Site: https://$SITE_DOMAIN"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "https://$SITE_DOMAIN/health"; then
              echo
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Health endpoint did not respond after 5 attempts."
          exit 1

      # Proves both that migrations were applied and that the task can reach RDS.
      - name: Verify database health endpoint
        if: steps.verify.outputs.service-exists == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "https://$SITE_DOMAIN/health/db"; then
              echo
              echo "Database reachable."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Database health endpoint did not come up."
          exit 1
