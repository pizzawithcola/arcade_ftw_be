AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Arcade FTW - Backend infrastructure (scope: backend only).
  Creates: ECR repository, ALB + Target Group, ECS Fargate cluster/service/task,
  security groups, IAM roles, CloudWatch log group.
  NOT included on purpose: VPC/subnets (shared with the legacy stack - passed in as
  parameters), RDS (placeholder phase), S3 + CloudFront (frontend repo's concern).

Metadata:
  Notes: |
    Adapted from cyber_ai_festival_be/infra/cloudformation.yml. Fixes carried over:
      - Parameter types use the real CFN types (the legacy template declared
        `AWS::EC2::Parameter`, which is not a valid parameter type).
      - The execution role gets a stack-scoped name instead of the global
        `ecsTaskExecutionRole` (which collides across stacks in one account).
      - The ECR repository is created here, so the stack is self-contained.
      - ALB idle timeout is raised because the service hosts a WebSocket.

Parameters:
  NamePrefix:
    Type: String
    Default: arcade-ftw
    Description: >
      Prefix for every resource name and for the ECR repository.
      Deliberately hyphenated: ALB and Target Group names reject underscores.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: SHARED RESOURCE - the legacy VPC. Referenced only, never modified.

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 1 for the ALB.

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 2 for the ALB.

  # Both task subnets MUST sit in Availability Zones the ALB above is enabled in,
  # otherwise the target group rejects the task with
  # "Target is in an Availability Zone that is not enabled for the load balancer",
  # the health check fails and the deployment rolls back. They must also provide
  # egress, which is why AssignPublicIp stays ENABLED below.
  TaskSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet 1 for the ECS tasks - ALB-enabled AZ and egress required.

  TaskSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet 2 for the ECS tasks - ALB-enabled AZ and egress required.

  SecretKey:
    Type: String
    Description: >
      Signs the bearer tokens issued by /api/auth/*. Changing it logs everybody
      out, which is also a useful way to invalidate every token at once.
    NoEcho: true

  AdminUsername:
    Type: String
    Default: admin
    Description: The show operator's username.

  AdminPassword:
    Type: String
    NoEcho: true
    Description: The show operator's password. Move to Secrets Manager before the event.

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for HTTPS. Leave empty to skip the 443 listener.
    Default: ''

  DesiredCount:
    Type: Number
    MinValue: 0
    MaxValue: 1
    Default: 1
    Description: >
      Running tasks. Use 0 to create the stack before the first image exists:
      a service with a non-zero count never reaches a steady state while the
      ECR repository is empty, and CloudFormation would hang and roll back.
      Never raise this above 1 - the engine keeps room state in process memory.

  GitHubRepo:
    Type: String
    Default: pizzawithcola/arcade_ftw_be
    Description: owner/repo allowed to assume the deploy role through OIDC.

  # GitHub's OIDC subject now carries immutable numeric IDs, e.g.
  # repo:pizzawithcola@68038650/arcade_ftw_be@1414195943:ref:refs/heads/main.
  # Both spellings are allowed below so the stack works whether or not the
  # repository sends the ID-qualified subject.
  GitHubRepoIds:
    Type: String
    Default: pizzawithcola@68038650/arcade_ftw_be@1414195943
    Description: owner@ownerId/repo@repoId as it appears in the OIDC subject.

  GitHubBranch:
    Type: String
    Default: main
    Description: Only workflow runs on this branch may assume the deploy role.

  DbSubnetGroupName:
    Type: String
    Default: default-vpc-0dda76b286c45fc27
    Description: >
      SHARED RESOURCE - the VPC's existing default DB subnet group. Referenced
      only, never modified. It already spans the subnets the legacy database
      uses, so no new subnets are needed and the shared VPC stays untouched.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class.

  DbEngineVersion:
    Type: String
    Default: '16.15'
    Description: >
      Exact PostgreSQL minor version. A major-only value such as '16' is
      rejected for new instances, and AWS retires old minors, so this is a
      parameter you can bump without editing the resource.

  DbName:
    Type: String
    Default: arcade_ftw
    Description: Initial database name.

  CloudFrontPrefixListId:
    Type: String
    Default: pl-9aa247f3
    Description: >
      The AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing
      for this region. Restricting the ALB to it means only CloudFront reaches
      the load balancer; change it if the load balancer ever moves region.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # ─── ECR ──────────────────────────────────────────────────────────────────────
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${NamePrefix}-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  # ─── Security Groups ──────────────────────────────────────────────────────────
  # CloudFront's origin-facing prefix list instead of 0.0.0.0/0, so the ALB is
  # not reachable directly from the internet.
  #
  # GroupDescription still says "from the internet" even though it is no longer
  # true: AWS rejects updates to a security group description and forces a
  # replacement, and the replacement cannot reuse the existing GroupName. Fixing
  # that wording would mean renaming the group and documenting the new name.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-alb-sg
      GroupDescription: ALB - inbound HTTP/HTTPS from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Only port 80: the ALB has no HTTPS listener yet. It also has to be a
        # single rule - CloudFront's origin-facing prefix list holds 46 entries
        # and a security group allows 60 rules, so referencing it twice (80 and
        # 443) exceeds the quota. Adding HTTPS later means dropping this rule or
        # raising the quota.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-ecs-sg
      GroupDescription: ECS tasks - inbound only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ─── Application Load Balancer ────────────────────────────────────────────────
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${NamePrefix}-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      # WebSocket connections are long-lived; the 60s default would drop them.
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '3600'

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  AlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${NamePrefix}-tg
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 8
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  # ─── ECS Cluster ──────────────────────────────────────────────────────────────
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${NamePrefix}-cluster

  # ─── IAM ──────────────────────────────────────────────────────────────────────
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt DbInstance.MasterUserSecret.SecretArn

  # ─── Task Definition ──────────────────────────────────────────────────────────
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${NamePrefix}-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '1024'
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Sub ${NamePrefix}-backend
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${NamePrefix}-backend:latest
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: LOG_LEVEL
              Value: INFO
            - Name: SECRET_KEY
              Value: !Ref SecretKey
            - Name: ADMIN_USERNAME
              Value: !Ref AdminUsername
            - Name: ADMIN_PASSWORD
              Value: !Ref AdminPassword
            - Name: DB_HOST
              Value: !GetAtt DbInstance.Endpoint.Address
            - Name: DB_PORT
              Value: !Sub ${DbInstance.Endpoint.Port}
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: DB_USER
              Value: !GetAtt DbInstance.MasterUsername
          # Only the password is a secret; host/port/name/user stay plain env so
          # the application assembles the DSN. CloudFormation cannot splice a
          # secret value into a composed connection string.
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${DbInstance.MasterUserSecret.SecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ─── ECS Service ──────────────────────────────────────────────────────────────
  EcsService:
    Type: AWS::ECS::Service
    # ECS rejects a service whose target group is not yet attached to a load
    # balancer, and the plain Ref on AlbTargetGroup does not imply the listener.
    DependsOn: AlbHttpListener
    Properties:
      ServiceName: !Sub ${NamePrefix}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref EcsTaskDefinition
      LaunchType: FARGATE
      # Exactly one task, and never scale out: the game engine keeps room state in
      # process memory, so a second task would serve a different, empty state.
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref TaskSubnet1
            - !Ref TaskSubnet2
          SecurityGroups:
            - !Ref EcsSecurityGroup
          # Keep ENABLED unless the task subnets gain a NAT gateway - DISABLED
          # removes all egress and the task cannot pull its image.
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref AlbTargetGroup
          ContainerName: !Sub ${NamePrefix}-backend
          ContainerPort: 8000
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  # ─── RDS ──────────────────────────────────────────────────────────────────────
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-rds-sg
      GroupDescription: RDS - inbound 5432 only from the ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsSecurityGroup

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${NamePrefix}-db
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      # The shared default DB subnet group already covers several AZs.
      DBSubnetGroupName: !Ref DbSubnetGroupName
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBName: !Ref DbName
      MasterUsername: arcade_ftw
      # RDS generates the password and keeps it in Secrets Manager, so no
      # credential is ever written into this template or into the repo.
      ManageMasterUserPassword: true
      # Public subnets are all this VPC has, so reachability is controlled by
      # the flag plus the security group above instead.
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      # Off on purpose: an unattended minor upgrade during an event is worse
      # than a slightly older patch level. The legacy database does the same.
      AutoMinorVersionUpgrade: false
      DeletionProtection: true
      # Deliberately not the legacy database's wed:03:00 maintenance window.
      # The backup window takes a bare time range; the day prefix is only valid
      # for the maintenance window.
      PreferredMaintenanceWindow: sun:04:00-sun:04:30
      PreferredBackupWindow: 02:00-02:30
      MonitoringInterval: 0
      EnablePerformanceInsights: false

  # ─── GitHub Actions OIDC ──────────────────────────────────────────────────────
  # No long-lived AWS keys anywhere: CI exchanges a short-lived GitHub token for
  # temporary credentials, scoped to one repository and one branch.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Both GitHub root CA thumbprints: the old one is kept so the stack keeps
      # working if AWS re-validates the chain against the previous CA.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOidcProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Locks the role to this repo and branch: a fork, another repo,
                # or a pull request cannot assume it. Values in a list are OR'd,
                # and both contain no wildcards, so the match stays exact.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubRepoIds}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt EcrRepository.Arn
              - Sid: EcsDeploy
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                  # Needed to run the one-off migration task before the rollout.
                  - ecs:RunTask
                  - ecs:DescribeTasks
                Resource: '*'
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt EcsTaskRole.Arn
                  - !GetAtt EcsTaskExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ReadLoadBalancer
                Effect: Allow
                Action: elasticloadbalancing:DescribeLoadBalancers
                Resource: '*'

  # ─── CloudWatch Logs ──────────────────────────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${NamePrefix}-backend
      RetentionInDays: 30

Outputs:
  AlbDnsName:
    Description: ALB DNS name - the API base URL.
    Value: !GetAtt Alb.DNSName
    # Consumed by the frontend stack as the CloudFront API origin.
    Export:
      Name: !Sub ${AWS::StackName}-AlbDns

  EcrRepositoryUri:
    Description: ECR repository URI - CI pushes here.
    Value: !GetAtt EcrRepository.RepositoryUri

  EcsClusterName:
    Description: ECS cluster name.
    Value: !Ref EcsCluster

  EcsServiceName:
    Description: ECS service name.
    Value: !GetAtt EcsService.Name

  TaskDefinitionFamily:
    Description: Task definition family - CI describes this to get the current revision.
    Value: !Ref EcsTaskDefinition

  GitHubDeployRoleArn:
    Description: Role ARN for the workflow's role-to-assume (OIDC, no secrets).
    Value: !GetAtt GitHubDeployRole.Arn

  DbEndpoint:
    Description: RDS endpoint host.
    Value: !GetAtt DbInstance.Endpoint.Address
