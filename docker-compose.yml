# Local Postgres for development and tests. Never points at the real RDS.
# Port 5433 on purpose: a local Postgres commonly owns 5432.
# Uses the upstream tag so an already-cached image is reused on dev machines;
# the production Dockerfile pulls from public.ecr.aws to dodge Docker Hub rate
# limits, which is a CI concern rather than a local one.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arcade_ftw
      POSTGRES_USER: arcade_ftw
      POSTGRES_PASSWORD: arcade_ftw
    ports:
      - "5433:5432"
    volumes:
      - arcade_ftw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcade_ftw -d arcade_ftw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcade_ftw_pgdata:
